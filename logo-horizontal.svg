<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 88" width="545" height="88">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,800&amp;display=swap');
      .word{font-family:'Literata',Georgia,serif;font-weight:800;font-size:26px}
      .domain{font-family:'Literata',Georgia,serif;font-weight:500;font-size:13px;letter-spacing:.05em}
    </style>
  </defs>
  <!-- mark -->
  <g transform="translate(0,4) scale(0.92)">
    <path d="M48 26 C36 16 16 16 10 23 V70 C16 63 36 63 48 73 C60 63 80 63 86 70 V23 C80 16 60 16 48 26 Z"
          fill="#FFFDF6" stroke="#22303A" stroke-width="5" stroke-linejoin="round"/>
    <path d="M48 26 V73" stroke="#22303A" stroke-width="5" stroke-linecap="round"/>
    <path d="M19 34 C27 30 37 31 41 34" fill="none" stroke="#E4442E" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 30 L19 34 L24 36" fill="none" stroke="#E4442E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55 34 C59 31 69 30 77 34" fill="none" stroke="#3E7C4F" stroke-width="4" stroke-linecap="round"/>
    <path d="M74 30 L77 34 L72 36" fill="none" stroke="#3E7C4F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 45 C28 42 38 43 42 46 M20 55 C28 52 38 53 42 56" fill="none" stroke="#C7DCEC" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M54 46 C58 43 68 42 76 45 M54 56 C58 53 68 52 76 55" fill="none" stroke="#C7DCEC" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M48 26 V12" stroke="#3E7C4F" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 16 C43 16 39 12 39 7 C44 7 48 10 48 16 Z" fill="#3E7C4F"/>
    <path d="M48 13 C48 8 52 4 58 4 C58 10 53 13 48 13 Z" fill="#F5C64C" stroke="#3E7C4F" stroke-width="1.5"/>
  </g>
  <!-- wordmark in fixed-width segments so the underline always sits under "Learn" -->
  <text class="word" x="104" y="42" fill="#22303A" textLength="188" lengthAdjust="spacingAndGlyphs">Learn to Read,</text>
  <text class="word" x="302" y="42" fill="#3E7C4F" textLength="98" lengthAdjust="spacingAndGlyphs">Read to</text>
  <text class="word" x="410" y="42" fill="#3E7C4F" textLength="72" lengthAdjust="spacingAndGlyphs">Learn</text>
  <!-- gold underline beneath "Learn" — the highlight from the app -->
  <rect x="302" y="46" width="180" height="6" rx="2" fill="#F5C64C"/>
  <text class="domain" x="104" y="66" fill="#5A6B76">LearnToReadReadToLearn.com</text>
</svg>
